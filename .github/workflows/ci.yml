name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true
      - run: go test -race -shuffle=on -count=1 ./...
      - run: go build ./cmd/coffe
      - run: go build ./cmd/release-manifest

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: bun install --frozen-lockfile
      - name: Check frontend
        working-directory: desktop/frontend
        run: bun test && bun run check && bun run build
      - name: Build native desktop
        working-directory: desktop
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean
