name: release-candidate

on:
  workflow_dispatch:
  push:
    tags: ["v*-rc.*"]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true
      - run: go test -race -shuffle=on -count=1 ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v4
        with:
          name: coffe-rc-snapshot
          path: dist/

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-amd64
          - os: macos-14
            label: darwin-arm64
          - os: windows-latest
            label: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Build native desktop
        working-directory: desktop
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean
      - uses: actions/upload-artifact@v4
        with:
          name: coffe-desktop-${{ matrix.label }}
          path: desktop/build/bin/
