name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true
      - run: go test -race -shuffle=on -count=1 ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate updater manifest
        shell: bash
        run: |
          go run ./cmd/release-manifest \
            --checksums dist/checksums.txt \
            --out dist/manifest.json \
            --version "$GITHUB_REF_NAME" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
      - name: Upload updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/manifest.json --clobber

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux_amd64
          - os: macos-14
            label: darwin_arm64
          - os: windows-latest
            label: windows_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Build native desktop
        working-directory: desktop
        run: >-
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean
          -ldflags "-s -w -X coffe/internal/version.Version=${{ github.ref_name }}
          -X coffe/internal/version.Commit=${{ github.sha }}"
      - name: Package Unix desktop
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "desktop/build/coffe-desktop_${GITHUB_REF_NAME}_${{ matrix.label }}.tar.gz" -C desktop/build/bin .
      - name: Package Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "desktop/build/bin/*" -DestinationPath "desktop/build/coffe-desktop_${env:GITHUB_REF_NAME}_${{ matrix.label }}.zip"
      - name: Upload Unix desktop
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "desktop/build/coffe-desktop_${GITHUB_REF_NAME}_${{ matrix.label }}.tar.gz" --clobber
      - name: Upload Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:GITHUB_REF_NAME" "desktop/build/coffe-desktop_${env:GITHUB_REF_NAME}_${{ matrix.label }}.zip" --clobber
